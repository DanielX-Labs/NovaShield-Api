name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pin action revisions instead of allowing tags to change underneath CI.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Suites create local ephemeral replica sets; no repository secrets are required.
      - run: npm test
      - run: npm run test:security
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: docker build -t novashield:ci .
      # Real image runtime checks use generated credentials and a disposable replica set.
      - run: node scripts/container-smoke.cjs
